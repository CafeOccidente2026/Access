name: Backend CI

# Se ejecuta en cada Pull Request que toque el backend. Levanta un Postgres
# real como servicio y arranca la aplicacion completa (igual que en local
# con Docker), asi se detecta cualquier problema de arranque, entidades o
# migraciones de Flyway antes de que se mezcle a main.
on:
  pull_request:
    branches: [main]
    paths:
      - "cafeoccidente-backend/**"
  push:
    branches: [main]
    paths:
      - "cafeoccidente-backend/**"

jobs:
  build:
    name: Compilar y arrancar el backend contra Postgres real
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafeoccidente-backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cafeoccidente_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://localhost:5432/cafeoccidente_ci
      DB_USER: ci_user
      DB_PASSWORD: ci_password

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Compilar y correr pruebas (levanta el contexto completo de Spring)
        run: mvn -B package
