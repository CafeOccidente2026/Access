name: Backend CI

# Se ejecuta en cada Pull Request que toque el backend. Levanta un Postgres
# real como servicio y arranca la aplicacion completa (igual que en local
# con Docker), asi se detecta cualquier problema de arranque, entidades o
# migraciones de Flyway antes de que se mezcle a main.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "cafeoccidente-backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "cafeoccidente-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    name: Compilar y arrancar el backend contra Postgres real
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafeoccidente-backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cafeoccidente_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://localhost:5432/cafeoccidente_ci
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      JWT_SECRET: ci-test-secret-key-minimo-32-caracteres-para-hs256
      ADMIN_USERNAME: ci_admin
      ADMIN_PASSWORD: ci_admin_password_2026
      # A nivel de job para que el if del paso de Sonar lo pueda leer; vacio si no hay secret.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo usa para el codigo nuevo y el blame.
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Compilar y correr pruebas (levanta el contexto completo de Spring)
        # verify tambien genera la cobertura de JaCoCo (target/site/jacoco/jacoco.xml).
        run: ./mvnw -B verify

      - name: Cache de SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-backend
          restore-keys: ${{ runner.os }}-sonar

      # Obligatorio: si SonarCloud no corre, el job queda en rojo (antes un fallo pasaba en verde).
      - name: Analisis SonarCloud
        id: sonar
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar

      # Si Sonar no corrio, el resumen del run lo dice con todas las letras.
      - name: Avisar que Sonar no corrio
        if: failure() && steps.sonar.outcome == 'failure'
        run: |
          echo "::error title=SonarCloud::Sonar no corrio: vuelva a correr el job"
          echo "### :x: Sonar no corrió: vuelva a correr el job" >> "$GITHUB_STEP_SUMMARY"
          echo "El analisis de SonarCloud fallo (por ejemplo, la descarga del analizador). Revise el paso 'Analisis SonarCloud' y vuelva a correr el job." >> "$GITHUB_STEP_SUMMARY"

      # Sin el secret (por ejemplo, un PR desde un fork) no se analiza; se avisa en el resumen.
      - name: Avisar que falta SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: |
          echo "### :warning: Sonar no corrió: falta el secret SONAR_TOKEN" >> "$GITHUB_STEP_SUMMARY"

      # El jar trae todas las dependencias reales del backend.
      # Librerias con vulnerabilidades altas o criticas (con arreglo publicado) dejan el job en rojo.
      # Excepciones solo en .trivyignore, con su motivo. La accion va fijada por commit (v0.36.0).
      - name: Escaneo de librerias (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: rootfs
          scan-ref: cafeoccidente-backend/target
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table
