name: Frontend CI

# Se ejecuta en cada Pull Request que toque el frontend, y tambien al
# hacer push directo a main (por si alguna vez se permite excepcionalmente).
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "cafe-occidente-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "cafe-occidente-frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Instalar y compilar el frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafe-occidente-frontend
    env:
      # A nivel de job para que el if del paso de Sonar lo pueda leer; vacio si no hay secret.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo usa para el codigo nuevo y el blame.
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: "npm"
          cache-dependency-path: cafe-occidente-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Vitest con jsdom (sin navegador): corre en Node, no requiere Chrome en Ubuntu.
      # --coverage deja coverage/cafe-occidente-frontend/lcov.info para SonarCloud.
      - name: Correr pruebas
        run: npx ng test --watch=false --coverage

      - name: Compilar (build de produccion)
        run: npm run build

      # Obligatorio: si SonarCloud no corre (por ejemplo, un 403 al bajar el analizador), el job queda en rojo.
      - name: Analisis SonarCloud
        id: sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          projectBaseDir: cafe-occidente-frontend

      # Si Sonar no corrio, el resumen del run lo dice con todas las letras.
      - name: Avisar que Sonar no corrio
        if: failure() && steps.sonar.outcome == 'failure'
        run: |
          echo "::error title=SonarCloud::Sonar no corrio: vuelva a correr el job"
          echo "### :x: Sonar no corrió: vuelva a correr el job" >> "$GITHUB_STEP_SUMMARY"
          echo "El analisis de SonarCloud fallo (por ejemplo, la descarga del analizador). Revise el paso 'Analisis SonarCloud' y vuelva a correr el job." >> "$GITHUB_STEP_SUMMARY"

      # Sin el secret (por ejemplo, un PR desde un fork) no se analiza; se avisa en el resumen.
      - name: Avisar que falta SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: |
          echo "### :warning: Sonar no corrió: falta el secret SONAR_TOKEN" >> "$GITHUB_STEP_SUMMARY"
