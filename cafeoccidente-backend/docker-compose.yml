services:
  postgres:
    image: postgres:18
    container_name: cafeoccidente-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    build: .
    container_name: cafeoccidente-backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      # S2: si existen, la app entra con APP_DB_USER y Flyway con FLYWAY_USER (deploy/roles-bd.sql);
      # si no, con DB_USER, como antes. DB_USER sigue siendo el superusuario del contenedor de la base.
      DB_USER: ${APP_DB_USER:-${DB_USER}}
      DB_PASSWORD: ${APP_DB_PASSWORD:-${DB_PASSWORD}}
      FLYWAY_USER: ${FLYWAY_USER:-}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:4200}
    ports:
      - "8090:8080"

volumes:
  postgres-data:
