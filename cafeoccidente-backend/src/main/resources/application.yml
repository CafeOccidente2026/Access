spring:
  application:
    name: cafeoccidente-backend
  profiles:
    active: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # S2: el rol migrador (dueno del esquema). Vacio = el mismo usuario de la app, como antes.
    user: ${FLYWAY_USER:}
    password: ${FLYWAY_PASSWORD:}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
