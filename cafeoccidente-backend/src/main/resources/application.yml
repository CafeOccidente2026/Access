spring:
  application:
    name: cafeoccidente-backend
  profiles:
    active: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # S2: el rol migrador (dueno del esquema). Vacio = el mismo usuario de la app, como antes.
    user: ${FLYWAY_USER:}
    password: ${FLYWAY_PASSWORD:}

server:
  port: 8080
  # S4: la IP real del cliente detras de Caddy. Tomcat solo cree X-Forwarded-For si la conexion viene de una IP
  # interna (la red de Docker); desde afuera se ignora, asi nadie se inventa otra IP para saltarse el limite de login.
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET}

app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
