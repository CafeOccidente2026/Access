spring:
  application:
    name: cafeoccidente-backend
  profiles:
    active: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    # R1: con 50 usuarios el pool por defecto (10) se agotaba y una peticion esperaba hasta 30 s antes de fallar.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 10000
  # R1: cada peticion en un hilo virtual; la espera por la base no ocupa un hilo del sistema.
  threads:
    virtual:
      enabled: true
  jpa:
    # R1: la conexion se suelta al terminar el servicio, no al terminar de escribir la respuesta.
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # S2: el rol migrador (dueno del esquema). Vacio = el mismo usuario de la app, como antes.
    user: ${FLYWAY_USER:}
    password: ${FLYWAY_PASSWORD:}

server:
  port: 8080
  # S4: la IP real del cliente detras de Caddy. Tomcat solo cree X-Forwarded-For si la conexion viene de una IP
  # interna (la red de Docker); desde afuera se ignora, asi nadie se inventa otra IP para saltarse el limite de login.
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET}

app:
  # S4: intentos fallidos de login desde una misma IP (toda una agencia sale por una) antes de la espera de 15 min.
  login:
    max-failures-per-ip: 30
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
