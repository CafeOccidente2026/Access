# Analisis de SonarCloud del frontend (lo corre frontend-ci.yml con sonarqube-scan-action).
sonar.organization=cafeoccidente2026
sonar.projectKey=CafeOccidente2026_Access_frontend

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts


# Lo genera "ng test --coverage" (opciones en angular.json).
sonar.javascript.lcov.reportPaths=coverage/cafe-occidente-frontend/lcov.info
