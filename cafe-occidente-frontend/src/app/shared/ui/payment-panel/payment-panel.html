<div class="grid grid-cols-[110px_1fr] gap-3 rounded border border-slate-400 bg-white/40 p-3">
  <span class="self-center text-center text-sm font-semibold text-slate-700">
    {{ definition.heading }}
  </span>

  <div class="flex flex-col gap-2">
    <label *ngFor="let method of definition.methods" class="flex items-center gap-2 text-sm">
      <span class="w-24 text-slate-700">{{ method.label }}:</span>
      <input
        class="w-40 rounded border border-slate-300 bg-white px-2 py-1 text-sm shadow-sm"
        [value]="method.value"
        readonly
      />
    </label>

    <div class="mt-1 flex items-center justify-end gap-2 text-sm font-semibold">
      <span>{{ definition.totalLabel }}:</span>
      <input
        class="w-32 rounded border border-slate-300 bg-green-100 px-2 py-1 text-right shadow-sm"
        [value]="definition.totalValue"
        readonly
      />
    </div>
  </div>
</div>
