<div class="flex h-screen w-full flex-col bg-shell-bg">
  <header
    class="flex items-center justify-between border-b border-shell-titlebar-border bg-shell-titlebar px-3 py-1.5"
  >
    <div class="flex items-center gap-2">
      <span class="inline-flex h-4 w-4 items-center justify-center rounded-sm bg-rose-700 text-[9px] font-bold text-white">
        A
      </span>
      <span class="text-sm text-slate-600">{{ appTitle }}</span>
    </div>
    <div class="flex items-center gap-3 text-slate-500">
      <span class="cursor-pointer select-none">&#8722;</span>
      <span class="cursor-pointer select-none">&#9633;</span>
      <span class="cursor-pointer select-none hover:text-red-600">&#10005;</span>
    </div>
  </header>

  <main class="relative flex-1 overflow-auto">
    <ng-content></ng-content>
  </main>

  <footer
    class="flex items-center justify-between bg-shell-statusbar px-3 py-1 text-xs text-white"
  >
    <span>{{ leftStatus }}</span>
    <span>{{ rightStatus }}</span>
  </footer>
</div>
