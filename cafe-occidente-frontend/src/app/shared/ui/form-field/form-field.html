<label class="flex items-center gap-2 text-sm">
  <span class="w-40 shrink-0 font-medium" [class]="labelClass">{{ field.label }}:</span>

  <select
    *ngIf="field.type === 'select'; else textLike"
    class="w-full rounded border border-slate-300 bg-white px-2 py-1 text-sm text-slate-800 shadow-sm focus:border-blue-400 focus:outline-none"
    [class]="field.highlighted ? highlightClass : ''"
    [disabled]="!!field.readonly"
    [(ngModel)]="inputValue"
  >
    <option *ngFor="let option of field.options" [value]="option">{{ option }}</option>
  </select>

  <ng-template #textLike>
    <input
      class="w-full rounded border border-slate-300 bg-white px-2 py-1 text-sm text-slate-800 shadow-sm focus:border-blue-400 focus:outline-none"
      [class]="field.highlighted ? highlightClass : ''"
      [type]="field.type === 'number' || field.type === 'currency' || field.type === 'percentage' ? 'text' : field.type"
      [readonly]="field.readonly"
      [(ngModel)]="inputValue"
    />
  </ng-template>
</label>
