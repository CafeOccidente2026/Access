<app-access-window
  [title]="content.windowTitle"
  [bodyClass]="bodyClass"
  (closeRequested)="onCloseRequested()"
>
  <div class="flex flex-col text-slate-800" [class]="content.compactFields ? 'gap-0.5 px-3 py-1' : 'gap-4 p-5'">
    <app-field-row
      [fields]="content.topFields"
      [fieldWidthClass]="content.compactFields ? 'w-auto flex-initial' : 'min-w-[240px] flex-1'"
      [labelWidthClass]="content.compactFields ? 'w-auto' : 'w-32'"
      [inputWidthClass]="content.compactFields ? 'max-w-[100px]' : 'min-w-[100px]'"
      (fieldValueChange)="fieldValueChange.emit($event)"
      (fieldCommitted)="fieldCommitted.emit($event)"
    ></app-field-row>
    <app-field-row
      [fields]="content.identificationFields"
      [fieldWidthClass]="content.compactFields ? 'w-auto flex-initial' : 'min-w-[240px] flex-1'"
      [labelWidthClass]="content.compactFields ? 'w-auto' : 'w-32'"
      [inputWidthClass]="content.compactFields ? 'max-w-[140px]' : 'min-w-[100px]'"
      (fieldValueChange)="fieldValueChange.emit($event)"
      (fieldCommitted)="fieldCommitted.emit($event)"
    ></app-field-row>

    <div *ngIf="content.federationFields" class="rounded border border-slate-500/40" [class]="content.compactFields ? 'px-3 py-1' : 'p-3'">
      <p class="mb-2 text-sm font-semibold text-slate-800">{{ content.federationHeading }}</p>
      <app-field-row
        [fields]="content.federationFields"
        labelClass="text-slate-800 font-semibold"
        [highlightClass]="content.federationHighlightClass || 'bg-orange-200'"
        (fieldValueChange)="fieldValueChange.emit($event)"
        (fieldCommitted)="fieldCommitted.emit($event)"
      ></app-field-row>
    </div>

    <app-field-row
      *ngIf="content.contactFields"
      [fields]="content.contactFields"
      [fieldWidthClass]="content.compactFields ? 'w-auto flex-initial' : 'min-w-[240px] flex-1'"
      [labelWidthClass]="content.compactFields ? 'w-auto' : 'w-32'"
      [inputWidthClass]="content.compactFields ? 'max-w-[150px]' : 'min-w-[100px]'"
      (fieldValueChange)="fieldValueChange.emit($event)"
      (fieldCommitted)="fieldCommitted.emit($event)"
    ></app-field-row>
    <app-field-row
      *ngIf="content.qualityFields"
      [fields]="content.qualityFields"
      [fieldWidthClass]="content.compactFields ? 'w-auto flex-initial' : 'min-w-[240px] flex-1'"
      [labelWidthClass]="content.compactFields ? 'w-auto' : 'w-32'"
      [inputWidthClass]="content.compactFields ? 'max-w-[100px]' : 'min-w-[100px]'"
      (fieldValueChange)="fieldValueChange.emit($event)"
      (fieldCommitted)="fieldCommitted.emit($event)"
    ></app-field-row>
    <app-field-row
      *ngIf="content.weightFields"
      [fields]="content.weightFields"
      [fieldWidthClass]="content.compactFields ? 'w-auto flex-initial' : 'min-w-[240px] flex-1'"
      [labelWidthClass]="content.compactFields ? 'w-auto' : 'w-32'"
      [inputWidthClass]="content.compactFields ? 'max-w-[80px]' : 'min-w-[100px]'"
      (fieldValueChange)="fieldValueChange.emit($event)"
      (fieldCommitted)="fieldCommitted.emit($event)"
    ></app-field-row>
    <app-field-row
      *ngIf="content.netWeightFields"
      [fields]="content.netWeightFields"
      [fieldWidthClass]="content.compactFields ? 'w-auto flex-initial' : 'min-w-[240px] flex-1'"
      [labelWidthClass]="content.compactFields ? 'w-auto' : 'w-32'"
      [inputWidthClass]="content.compactFields ? 'max-w-[80px]' : 'min-w-[100px]'"
      (fieldValueChange)="fieldValueChange.emit($event)"
      (fieldCommitted)="fieldCommitted.emit($event)"
    ></app-field-row>
    <app-field-row
      *ngIf="content.priceFields"
      [fields]="content.priceFields"
      (fieldValueChange)="fieldValueChange.emit($event)"
      (fieldCommitted)="fieldCommitted.emit($event)"
    ></app-field-row>

    <div class="flex flex-wrap items-start gap-6">
      <div class="flex flex-col gap-3" *ngIf="content.discountField || content.paymentTypeField">
        <app-form-field
          *ngIf="content.discountField"
          [field]="content.discountField"
          [inputWidthClass]="content.compactFields ? 'max-w-[100px]' : 'min-w-[100px]'"
          (valueChange)="fieldValueChange.emit({ key: content.discountField.key, value: $event })"
          (committed)="fieldCommitted.emit(content.discountField.key)"
        ></app-form-field>
        <app-form-field
          *ngIf="content.paymentTypeField"
          [field]="content.paymentTypeField"
          (valueChange)="fieldValueChange.emit({ key: content.paymentTypeField.key, value: $event })"
          (committed)="fieldCommitted.emit(content.paymentTypeField.key)"
        ></app-form-field>
      </div>

      <app-payment-panel
        *ngIf="content.paymentPanel"
        class="flex-1"
        [definition]="content.paymentPanel"
      ></app-payment-panel>
    </div>

    <app-section-divider [text]="content.settlementHeading"></app-section-divider>

    <app-field-row
      [fields]="content.settlementFields"
      [fieldWidthClass]="content.compactFields ? 'w-auto flex-initial' : 'min-w-[240px] flex-1'"
      [labelWidthClass]="content.compactFields ? 'w-auto' : 'w-32'"
      [inputWidthClass]="content.compactFields ? 'max-w-[130px]' : 'min-w-[100px]'"
      (fieldValueChange)="fieldValueChange.emit($event)"
      (fieldCommitted)="fieldCommitted.emit($event)"
    ></app-field-row>
    <app-field-row
      *ngIf="content.settlementSecondaryFields"
      [fields]="content.settlementSecondaryFields"
      (fieldValueChange)="fieldValueChange.emit($event)"
      (fieldCommitted)="fieldCommitted.emit($event)"
    ></app-field-row>

    <div class="flex flex-wrap items-center justify-between gap-4">
      <app-field-row
        *ngIf="content.additionalDiscountFields"
        [fields]="content.additionalDiscountFields"
        [fieldWidthClass]="content.compactFields ? 'w-auto flex-initial' : 'min-w-[240px] flex-1'"
        [labelWidthClass]="content.compactFields ? 'w-auto' : 'w-32'"
        [inputWidthClass]="content.compactFields ? 'max-w-[130px]' : 'min-w-[100px]'"
        class="flex-1"
        (fieldValueChange)="fieldValueChange.emit($event)"
        (fieldCommitted)="fieldCommitted.emit($event)"
      ></app-field-row>
      <app-form-field
        *ngIf="content.netToPayField"
        [field]="content.netToPayField"
        [inputWidthClass]="content.compactFields ? 'max-w-[130px]' : 'min-w-[100px]'"
        (valueChange)="fieldValueChange.emit({ key: content.netToPayField.key, value: $event })"
        (committed)="fieldCommitted.emit(content.netToPayField.key)"
      ></app-form-field>
      <app-form-field *ngIf="content.statusField" [field]="content.statusField"></app-form-field>
    </div>

    <div *ngIf="content.reprintButtonLabel" [class]="content.compactFields ? '' : 'pt-2'">
      <app-button [label]="content.reprintButtonLabel" variant="access" (pressed)="reprintPressed.emit()"></app-button>
    </div>
  </div>
</app-access-window>
