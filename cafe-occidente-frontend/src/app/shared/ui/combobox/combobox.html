<div class="relative w-full">
  <input
    #inputEl
    type="text"
    autocomplete="off"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen"
    [attr.data-field-key]="dataFieldKey"
    [class]="inputClass"
    [style.padding-right]="disabled ? null : '1.75rem'"
    [disabled]="disabled"
    [value]="inputText"
    (input)="onInputChange($any($event.target).value)"
    (focus)="onFocus()"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />
  <!-- Flecha de desplegable, como la de un <select> nativo: deja claro que el campo abre una lista. -->
  <svg
    *ngIf="!disabled"
    aria-hidden="true"
    viewBox="0 0 20 20"
    fill="currentColor"
    class="pointer-events-none absolute right-2 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500"
  >
    <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.17l3.71-3.94a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06z" clip-rule="evenodd" />
  </svg>

  <ul
    #listEl
    *ngIf="isOpen && filteredOptions.length"
    role="listbox"
    class="fixed z-50 max-h-48 overflow-auto rounded border border-slate-300 bg-white text-sm shadow-lg"
    [style.left.px]="listBox.left"
    [style.width.px]="listBox.width"
    [style.top.px]="listBox.top"
    [style.bottom.px]="listBox.bottom"
  >
    <li
      *ngFor="let option of filteredOptions; let i = index"
      role="option"
      [attr.aria-selected]="i === highlightedIndex"
      [class]="'cursor-pointer px-2 py-1 ' + (i === highlightedIndex ? 'bg-blue-100 text-slate-900' : 'text-slate-800 hover:bg-slate-100')"
      (mousedown)="onOptionMouseDown($event, option)"
    >
      {{ option }}
    </li>
  </ul>
</div>
