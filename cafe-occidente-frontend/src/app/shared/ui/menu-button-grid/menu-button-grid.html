<div
  class="grid gap-3"
  [class.grid-cols-1]="columns === 1"
  [class.grid-cols-2]="columns === 2"
  [class.grid-cols-3]="columns === 3"
>
  <div *ngFor="let option of options" class="flex flex-col gap-0.5">
    <app-button
      [label]="option.label"
      variant="menu"
      [active]="!!option.emphasis"
      [disabled]="!!option.disabled"
      (pressed)="onSelect(option)"
    ></app-button>
    <span *ngIf="option.hint" class="px-1 text-xs text-slate-500">{{ option.hint }}</span>
  </div>
</div>
