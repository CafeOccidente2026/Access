<div class="h-screen bg-white p-3">
  <app-purchase-form-view
    *ngIf="viewContent() as d"
    [content]="d"
    (fieldValueChange)="onFieldValueChange($event)"
    (fieldCommitted)="onFieldCommitted($event)"
    (reprintPressed)="print()"
    (closeRequested)="onClose()"
  ></app-purchase-form-view>

  <app-confirm-dialog
    *ngIf="errorMessage() as msg"
    [message]="msg"
    confirmLabel="Aceptar"
    (confirmed)="errorMessage.set(null)"
  ></app-confirm-dialog>
</div>
