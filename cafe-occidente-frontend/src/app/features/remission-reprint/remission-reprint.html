<div class="flex h-screen flex-col bg-white p-3">
  <app-access-window title="REIMPRIMIR REMISIÓN" bodyClass="bg-white flex-1 flex flex-col">
    <div class="flex flex-1 flex-col gap-3 p-4">
      <div class="flex items-end gap-3">
        <label class="flex w-56 flex-col gap-1 text-sm">
          <span class="font-medium text-blue-900">Pto Compra</span>
          <app-agency-picker (agencyChange)="agencyId.set($event)"></app-agency-picker>
        </label>
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium text-blue-900">N° de Remisión</span>
          <input type="text" class="rounded border border-slate-300 px-2 py-1" [value]="remissionNumber()" (input)="remissionNumber.set($any($event.target).value)" (keyup.enter)="search()" />
        </label>
        <button type="button" class="rounded border border-slate-400 bg-slate-100 px-4 py-1.5 text-sm font-medium hover:bg-slate-200" (click)="search()">
          Aceptar
        </button>
        <p *ngIf="message() as m" class="pb-1.5 text-sm text-red-600">{{ m }}</p>
      </div>
      <iframe *ngIf="pdfUrl() as url" title="REMISIÓN" class="h-full min-h-[480px] w-full flex-1 border" [src]="url"></iframe>
    </div>
  </app-access-window>
</div>
