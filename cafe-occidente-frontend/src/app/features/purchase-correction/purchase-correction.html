<div class="flex h-screen flex-col bg-white p-3" *ngIf="content() as c">
  <app-access-window [title]="c.windowTitle" bodyClass="bg-white flex-1 flex flex-col overflow-auto">
    <div class="flex flex-col gap-3 p-3 text-sm">
      <app-invoice-search [browser]="browser" [texts]="c">
        <button type="button" class="rounded border border-slate-400 bg-white px-4 py-1.5 font-bold hover:bg-slate-100" (click)="back()">{{ c.backLabel }}</button>
        <p message *ngIf="message() as m" data-testid="message" class="pb-1.5 font-semibold" [class.text-red-600]="noticeError() || !detailValue()" [class.text-teal-700]="!noticeError() && !!detailValue()">{{ m }}</p>
      </app-invoice-search>

      <app-purchase-form-view *ngIf="view() as v" [content]="v" [readOnly]="true"></app-purchase-form-view>

      <p *ngIf="annulled()" class="font-bold text-red-700">{{ c.messages.annulled }}</p>

      <form
        *ngIf="detailValue() && !annulled()"
        data-correction
        appFormFlow
        class="flex flex-col gap-3 rounded border border-blue-200 bg-blue-50 p-3"
        (submit)="$event.preventDefault()"
      >
        <h3 class="font-bold text-blue-900">{{ c.heading }}</h3>
        <p *ngIf="previewError() as e" class="font-semibold text-red-600">{{ e }}</p>

        <fieldset class="flex flex-wrap gap-3" [disabled]="blocked()">
          <label *ngFor="let f of fields()" class="flex flex-col gap-1">
            <span class="font-medium text-blue-900">{{ f.label }}:</span>
            <input
              type="text"
              [attr.inputmode]="f.text ? null : 'decimal'"
              [attr.data-field-key]="f.key"
              [class]="'rounded border border-slate-300 px-2 py-1 ' + (f.text ? 'w-56' : 'w-28 text-right')"
              [value]="values()[f.key] ?? ''"
              (input)="setValue(f.key, $any($event.target).value)"
              (change)="recalculate()"
            />
          </label>
        </fieldset>

        <table class="w-fit text-right">
          <thead>
            <tr>
              <th></th>
              <th class="px-3 font-medium text-slate-600">{{ c.beforeLabel }}</th>
              <th class="px-3 font-bold text-blue-900">{{ c.afterLabel }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of c.results">
              <td class="pr-3 text-left font-medium text-blue-900">{{ r.label }}</td>
              <td class="px-3 text-slate-600">{{ result(r.key).before }}</td>
              <td class="px-3 font-bold" [attr.data-result]="r.key">{{ result(r.key).after }}</td>
            </tr>
          </tbody>
        </table>

        <fieldset class="flex flex-wrap items-end gap-3" [disabled]="blocked()">
          <label *ngFor="let f of c.paymentFields" class="flex flex-col gap-1">
            <span class="font-medium text-blue-900">{{ f.label }}:</span>
            <input
              type="text"
              [attr.inputmode]="f.text ? 'numeric' : 'decimal'"
              [attr.data-field-key]="f.key"
              [class]="'rounded border border-slate-300 px-2 py-1 ' + (f.text ? 'w-20' : 'w-32 text-right')"
              [value]="payment()[f.key] ?? ''"
              (input)="setPayment(f.key, $any($event.target).value)"
            />
          </label>
          <span class="pb-1.5">{{ c.paymentTotalLabel }}: <b>{{ paymentTotalText() }}</b></span>
        </fieldset>
        <p *ngIf="after() && !balanced()" class="font-semibold text-red-600">{{ c.messages.unbalanced }}</p>

        <div>
          <button
            type="button"
            data-testid="save"
            data-flow-submit
            class="rounded border border-blue-600 bg-blue-700 px-4 py-1.5 font-bold text-white hover:bg-blue-800 disabled:opacity-50"
            [disabled]="!canSave() || saving()"
            (click)="save()"
          >
            {{ c.saveLabel }}
          </button>
        </div>
      </form>
    </div>
  </app-access-window>
</div>
