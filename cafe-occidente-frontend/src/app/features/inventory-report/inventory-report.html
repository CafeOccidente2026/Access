<div class="flex h-screen flex-col bg-white p-3">
  <app-access-window [title]="byCode ? 'DIÁLOGO INVENTARIO POR CÓDIGO' : 'INVENTARIO POR ESPECIALIDAD'" bodyClass="bg-white flex-1 flex flex-col">
    <div class="flex flex-1 flex-col gap-3 p-4">
      <div class="flex items-end gap-3">
        <label *ngIf="byCode || admin" class="flex w-56 flex-col gap-1 text-sm">
          <span class="font-bold text-blue-900">Pto Compra:</span>
          <app-agency-picker (agencyChange)="agencyId.set($event)"></app-agency-picker>
        </label>
        <label class="flex w-[28rem] flex-col gap-1 text-sm">
          <span class="font-bold text-blue-900">{{ byCode ? 'Cód Producto:' : 'Especialidad:' }}</span>
          <app-combobox
            [options]="byCode ? productLabels() : specials()"
            inputClass="w-full rounded border border-slate-300 px-2 py-1 text-sm"
            (valueChange)="choice.set($event)"
          ></app-combobox>
        </label>
        <button type="button" class="rounded border border-slate-400 bg-slate-100 px-4 py-1.5 text-sm font-bold hover:bg-slate-200" (click)="accept()">Aceptar</button>
        <button type="button" class="rounded border border-slate-400 bg-white px-4 py-1.5 text-sm font-bold hover:bg-slate-100" (click)="cancel()">Cancelar</button>
      </div>
      <p *ngIf="message() as m" class="text-sm text-red-600">{{ m }}</p>
      <iframe *ngIf="pdfUrl() as url" title="INVENTARIO" class="min-h-[480px] w-full flex-1 border" [src]="url"></iframe>
    </div>
  </app-access-window>
</div>
