<app-access-window *ngIf="page() as p" [title]="p.windowTitle" closeRoute="/menu-principal">
  <div class="flex flex-col gap-6 p-6">
    <section class="flex max-w-xl flex-col gap-3">
      <h2 class="text-sm font-semibold text-slate-700">{{ p.sectionTitle }}</h2>

      <label class="flex items-center gap-2 text-sm">
        <span class="w-48 shrink-0 font-medium text-slate-700">{{ p.fundLabel }}:</span>
        <select
          data-field-key="fundId"
          class="w-full min-w-[100px] rounded border border-slate-300 bg-white px-2 py-1 text-sm text-slate-800 shadow-sm focus:border-blue-400 focus:outline-none"
          [(ngModel)]="fundId"
          (ngModelChange)="onFundChange()"
          (keydown.enter)="onEnter('fundId')"
        >
          <option [ngValue]="null"></option>
          <option *ngFor="let fund of funds()" [ngValue]="fund.id">{{ fund.code }}</option>
        </select>
      </label>

      <div class="flex flex-col gap-1">
        <label class="flex items-center gap-2 text-sm">
          <span class="w-48 shrink-0 font-medium text-slate-700">{{ p.basePriceLoadLabel }}:</span>
          <input
            type="text"
            inputmode="numeric"
            data-field-key="basePriceLoad"
            class="w-full min-w-[100px] rounded border px-2 py-1 text-sm text-slate-800 shadow-sm focus:border-blue-400 focus:outline-none"
            [class.border-red-500]="priceError"
            [class.border-slate-300]="!priceError"
            [value]="basePriceLoad"
            (input)="onPriceInput($any($event.target).value)"
            (focus)="onFocus('basePriceLoad')"
            (keydown.enter)="onEnter('basePriceLoad')"
          />
        </label>
        <p *ngIf="priceError" class="ml-48 pl-2 text-xs text-red-600">{{ priceError }}</p>
      </div>

      <p *ngIf="error()" class="text-sm text-red-600" data-testid="error">{{ error() }}</p>

      <div class="flex justify-end gap-3">
        <app-button [label]="p.saveButton" variant="access" (pressed)="save()"></app-button>
        <app-button [label]="p.updateButton" variant="access" (pressed)="openList()"></app-button>
      </div>
    </section>

    <section *ngIf="rows() as list" class="flex flex-col gap-2" data-testid="types">
      <h2 class="text-sm font-semibold text-slate-700">{{ p.listTitle }}</h2>
      <table class="w-full text-left text-sm">
        <thead class="text-slate-600">
          <tr>
            <th class="py-1">{{ p.columns.specialType }}</th>
            <th class="py-1">{{ p.columns.basePriceLoad }}</th>
            <th class="py-1">{{ p.columns.specialSurcharge }}</th>
            <th class="py-1">{{ p.columns.defectiveUnitPrice }}</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of list; let i = index" class="border-t border-slate-200">
            <td class="py-1 pr-2">{{ row.specialType }}</td>
            <td class="py-1 pr-2">
              <label for="type-price-{{ i }}">
                <span class="sr-only">{{ p.columns.basePriceLoad }} {{ p.of }} {{ row.specialType }}</span>
                <input id="type-price-{{ i }}" type="text" inputmode="numeric" class="w-32 rounded border border-slate-300 px-2 py-1"
                  [value]="row.basePriceLoad" (input)="onRowInput(row, 'basePriceLoad', $any($event.target).value)" />
              </label>
            </td>
            <td class="py-1 pr-2">
              <label for="type-surcharge-{{ i }}">
                <span class="sr-only">{{ p.columns.specialSurcharge }} {{ p.of }} {{ row.specialType }}</span>
                <input id="type-surcharge-{{ i }}" type="text" inputmode="numeric" class="w-28 rounded border border-slate-300 px-2 py-1"
                  [value]="row.specialSurcharge" (input)="onRowInput(row, 'specialSurcharge', $any($event.target).value)" />
              </label>
            </td>
            <td class="py-1 pr-2">
              <label for="type-pasilla-{{ i }}">
                <span class="sr-only">{{ p.columns.defectiveUnitPrice }} {{ p.of }} {{ row.specialType }}</span>
                <input id="type-pasilla-{{ i }}" type="text" inputmode="numeric" class="w-28 rounded border border-slate-300 px-2 py-1"
                  [value]="row.defectiveUnitPrice" (input)="onRowInput(row, 'defectiveUnitPrice', $any($event.target).value)" />
              </label>
            </td>
            <td class="py-1">
              <app-button [label]="p.rowSaveButton" variant="access" (pressed)="saveRow(row)"></app-button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
  <app-success-overlay [message]="message()"></app-success-overlay>
</app-access-window>
