<div class="flex h-screen flex-col bg-white p-3" *ngIf="content() as c">
  <app-access-window *ngIf="report() as r" [title]="r.windowTitle" bodyClass="bg-white flex-1 flex flex-col">
    <div class="flex flex-1 flex-col gap-3 p-4">
      <div class="flex flex-wrap items-end gap-3">
        <label class="flex w-56 flex-col gap-1 text-sm">
          <span class="font-bold text-blue-900">{{ c.agencyLabel }}:</span>
          <app-agency-picker (agencyChange)="agencyId.set($event)"></app-agency-picker>
        </label>
        <label *ngFor="let f of r.filters" class="flex w-44 flex-col gap-1 text-sm">
          <span class="font-bold text-blue-900">{{ f.label }}:</span>
          <input
            *ngIf="f.type === 'date'; else list"
            type="date"
            class="w-full rounded border border-slate-300 px-2 py-1 text-sm"
            [attr.data-field-key]="f.key"
            (input)="setFilter(f.key, $any($event.target).value)"
          />
          <ng-template #list>
            <app-combobox
              [options]="f.options ?? []"
              [dataFieldKey]="f.key"
              inputClass="w-full rounded border border-slate-300 px-2 py-1 text-sm"
              (valueChange)="setFilter(f.key, $event)"
            ></app-combobox>
          </ng-template>
        </label>
        <button type="button" class="rounded border border-slate-400 bg-slate-100 px-4 py-1.5 text-sm font-bold hover:bg-slate-200" (click)="accept()">{{ c.acceptLabel }}</button>
        <button type="button" class="rounded border border-slate-400 bg-white px-4 py-1.5 text-sm font-bold hover:bg-slate-100" (click)="cancel()">{{ c.cancelLabel }}</button>
        <button *ngIf="r.excel && rows().length" type="button" class="rounded border border-teal-500 bg-teal-600 px-4 py-1.5 text-sm font-bold text-white hover:bg-teal-700" (click)="downloadExcel()">{{ c.downloadLabel }}</button>
      </div>
      <p *ngIf="admin" class="text-xs text-slate-500">{{ c.allAgenciesHint }}</p>
      <p *ngIf="message() as m" class="text-sm text-red-600">{{ m }}</p>
      <iframe *ngIf="pdfUrl() as url" [title]="r.windowTitle" class="min-h-[480px] w-full flex-1 border" [src]="url"></iframe>
    </div>
  </app-access-window>
</div>
