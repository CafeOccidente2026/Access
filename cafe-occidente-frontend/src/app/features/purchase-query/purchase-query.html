<div class="flex h-screen flex-col gap-2 bg-white p-3" *ngIf="content() as c">
  <form class="flex flex-wrap items-end gap-2 text-sm" appFormFlow (submit)="search($event, invoiceInput.value)">
    <label class="flex flex-col gap-1">
      <span class="font-bold text-blue-900">{{ c.invoiceLabel }}:</span>
      <input #invoiceInput type="text" inputmode="numeric" data-field-key="invoice" class="w-40 rounded border border-slate-300 px-2 py-1" />
    </label>
    <button type="submit" data-flow-submit class="rounded border border-slate-400 bg-slate-100 px-4 py-1.5 font-bold hover:bg-slate-200">{{ c.searchLabel }}</button>
    <app-invoice-navigator [buttons]="c.navigation" (navigate)="go($event)"></app-invoice-navigator>
    <p *ngIf="message() as m" data-testid="message" class="pb-1.5 font-semibold text-red-600">{{ m }}</p>
  </form>

  <div *ngIf="candidates().length > 1" class="flex flex-wrap gap-2 text-sm">
    <button
      *ngFor="let cand of candidates()"
      type="button"
      class="rounded border px-3 py-1"
      [class.border-blue-500]="selected() === cand"
      [class.border-slate-300]="selected() !== cand"
      (click)="choose(cand)"
    >
      {{ c.modules[cand.module] }} · {{ cand.prefix }} {{ cand.invoiceNumber }}
    </button>
  </div>

  <div class="flex-1 overflow-auto">
    <app-purchase-form-view *ngIf="view() as v" [content]="v" [readOnly]="true" (reprintPressed)="reprint()"></app-purchase-form-view>
  </div>
</div>
