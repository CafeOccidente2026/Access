<div class="flex h-screen flex-col gap-2 bg-white p-3" *ngIf="content() as c">
  <app-invoice-search [browser]="browser" [texts]="c">
    <p message *ngIf="message() as m" data-testid="message" class="pb-1.5 font-semibold text-red-600">{{ m }}</p>
  </app-invoice-search>

  <div class="flex-1 overflow-auto">
    <app-purchase-form-view *ngIf="view() as v" [content]="v" [readOnly]="true" (reprintPressed)="reprint()"></app-purchase-form-view>
  </div>
</div>
