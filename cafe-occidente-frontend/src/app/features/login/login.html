<app-window-shell *ngIf="page() as p" [appTitle]="p.shell.appTitle">
  <div class="flex h-full items-center justify-center bg-gradient-to-br from-panel-welcome to-panel-teal-soft">
    <div class="w-[400px] overflow-hidden rounded-xl bg-white shadow-2xl">
      <div class="flex flex-col items-center gap-2 bg-gradient-to-br from-panel-teal-strong to-panel-cyan px-8 py-7 text-white">
        <span class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-white/20 text-2xl">🔒</span>
        <h1 class="text-lg font-semibold">{{ p.form.windowTitle }}</h1>
      </div>

      <div class="flex flex-col gap-5 px-8 py-8">
        <label class="flex flex-col gap-1 text-sm font-medium text-slate-600">
          {{ p.form.userLabel }}
          <input
            class="rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-panel-cyan focus:outline-none focus:ring-2 focus:ring-panel-cyan/40"
            [(ngModel)]="username"
          />
        </label>

        <label class="flex flex-col gap-1 text-sm font-medium text-slate-600">
          {{ p.form.passwordLabel }}
          <span class="relative flex items-center">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-10 text-sm shadow-sm focus:border-panel-cyan focus:outline-none focus:ring-2 focus:ring-panel-cyan/40"
              [(ngModel)]="password"
            />
            <button
              type="button"
              class="absolute right-2 flex h-6 w-6 items-center justify-center text-slate-400 hover:text-slate-600"
              [attr.aria-label]="showPassword() ? p.form.hidePasswordLabel : p.form.showPasswordLabel"
              (click)="togglePasswordVisibility()"
            >
              <svg *ngIf="!showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg *ngIf="showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </span>
        </label>

        <p *ngIf="errorMessage()" class="text-sm text-red-600">{{ errorMessage() }}</p>

        <div class="flex justify-end gap-3 pt-2">
          <app-button [label]="p.form.cancelLabel" variant="access" (pressed)="onCancel()"></app-button>
          <app-button [label]="p.form.acceptLabel" variant="access" (pressed)="onAccept()"></app-button>
        </div>
      </div>
    </div>
  </div>
</app-window-shell>
