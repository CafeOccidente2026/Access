<div class="h-screen bg-panel-sky p-3" *ngIf="data() as d">
  <app-access-window [title]="d.windowTitle" bodyClass="bg-panel-sky">
    <div class="grid grid-cols-2 gap-10 p-8">
      <div class="flex flex-col gap-8">
        <app-menu-button-grid [options]="d.leftOptions" [columns]="1"></app-menu-button-grid>
        <div class="w-48">
          <app-menu-button-grid [options]="[d.leftStandaloneOption]" [columns]="1"></app-menu-button-grid>
        </div>
      </div>
      <app-menu-button-grid [options]="d.rightOptions" [columns]="1"></app-menu-button-grid>
    </div>
  </app-access-window>
</div>
