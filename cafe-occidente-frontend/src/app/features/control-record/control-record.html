<div class="h-screen bg-white p-3" *ngIf="page() as p">
  <app-access-window [title]="p.windowTitle" bodyClass="bg-white">
    <div class="flex flex-col gap-4 p-6">
      <h1 class="text-2xl font-semibold text-slate-700">{{ p.heading }}</h1>

      <label class="flex items-center gap-2 text-sm">
        <span class="w-52 shrink-0 font-medium text-blue-900">{{ p.agencyLabel }}:</span>
        <select
          class="w-full max-w-[260px] rounded border border-slate-300 bg-white px-2 py-1 text-sm text-slate-800 shadow-sm focus:border-blue-400 focus:outline-none"
          (change)="onAgencyChange($any($event.target).value)"
        >
          <option value=""></option>
          <option *ngFor="let agency of agencies()" [value]="agency.id">{{ agency.name }}</option>
        </select>
      </label>

      <p *ngIf="isCreate() && agencyId()" class="text-sm text-amber-700">{{ p.createNotice }}</p>

      <div class="grid grid-cols-2 gap-x-12 gap-y-3">
        <div class="flex flex-col gap-3">
          <app-form-field
            *ngFor="let field of leftFields()"
            [field]="field"
            labelClass="text-blue-900"
            labelWidthClass="w-52"
            (valueChange)="onFieldValueChange({ key: field.key, value: $event })"
          ></app-form-field>
        </div>
        <div class="flex flex-col gap-3">
          <app-form-field
            *ngFor="let field of rightFields()"
            [field]="field"
            labelClass="text-blue-900"
            labelWidthClass="w-52"
            (valueChange)="onFieldValueChange({ key: field.key, value: $event })"
          ></app-form-field>
        </div>
      </div>

      <p *ngIf="savedMessage()" class="text-sm text-green-700">{{ savedMessage() }}</p>
      <p *ngIf="errorMessage()" class="text-sm text-red-600">{{ errorMessage() }}</p>

      <div class="flex justify-end">
        <button
          *ngIf="agencyId()"
          class="rounded border border-slate-400 bg-slate-100 px-4 py-1.5 text-sm font-medium text-slate-800 shadow-sm hover:bg-slate-200"
          (click)="save()"
        >
          {{ p.saveButton }}
        </button>
      </div>
    </div>
  </app-access-window>
</div>
