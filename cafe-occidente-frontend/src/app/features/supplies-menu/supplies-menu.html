<div class="h-screen bg-gradient-to-br from-panel-teal-soft to-accent-green-soft p-3" *ngIf="data() as d">
  <app-access-window [title]="d.windowTitle" bodyClass="bg-gradient-to-br from-panel-teal-soft to-accent-green-soft">
    <div class="flex flex-col gap-6 p-8">
      <div class="flex gap-6">
        <div class="w-64" *ngFor="let column of d.columns">
          <app-menu-button-grid [options]="column" [columns]="1"></app-menu-button-grid>
        </div>
      </div>
      <div class="w-64 self-center">
        <app-menu-button-grid [options]="[d.back]" [columns]="1"></app-menu-button-grid>
      </div>
    </div>
  </app-access-window>
</div>
