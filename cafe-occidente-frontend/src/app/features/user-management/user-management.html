<div
  class="flex h-screen items-center justify-center bg-gradient-to-br from-panel-sky to-panel-cyan p-6"
  *ngIf="page() as p"
>
  <div class="w-[720px]">
    <app-access-window [title]="p.windowTitle" bodyClass="bg-white" closeRoute="/acceso-principal">
      <div class="flex flex-col gap-6 p-6">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500">
              <th class="py-2">{{ p.listHeaders.username }}</th>
              <th class="py-2">{{ p.listHeaders.fullName }}</th>
              <th class="py-2">{{ p.listHeaders.role }}</th>
              <th class="py-2">{{ p.listHeaders.active }}</th>
              <th class="py-2"></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users()" class="border-b border-slate-100">
              <td class="py-2">{{ user.username }}</td>
              <td class="py-2">{{ user.fullName }}</td>
              <td class="py-2">{{ roleLabel(user.role) }}</td>
              <td class="py-2">{{ user.active ? p.activeLabel : p.inactiveLabel }}</td>
              <td class="py-2">
                <app-button
                  *ngIf="user.active"
                  [label]="p.deactivateLabel"
                  variant="plain"
                  (pressed)="onDeactivate(user)"
                ></app-button>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="flex flex-col gap-4 rounded-lg border border-slate-200 p-4">
          <h2 class="text-sm font-semibold text-slate-700">{{ p.createSectionTitle }}</h2>

          <label class="flex flex-col gap-1 text-sm font-medium text-slate-600">
            {{ p.usernameLabel }}
            <input
              class="rounded border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-panel-cyan focus:outline-none focus:ring-2 focus:ring-panel-cyan/40"
              [(ngModel)]="username"
            />
          </label>

          <label class="flex flex-col gap-1 text-sm font-medium text-slate-600">
            {{ p.passwordLabel }}
            <input
              type="password"
              class="rounded border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-panel-cyan focus:outline-none focus:ring-2 focus:ring-panel-cyan/40"
              [(ngModel)]="password"
            />
          </label>

          <label class="flex flex-col gap-1 text-sm font-medium text-slate-600">
            {{ p.fullNameLabel }}
            <input
              class="rounded border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-panel-cyan focus:outline-none focus:ring-2 focus:ring-panel-cyan/40"
              [(ngModel)]="fullName"
            />
          </label>

          <label class="flex flex-col gap-1 text-sm font-medium text-slate-600">
            {{ p.roleLabel }}
            <select
              class="rounded border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-panel-cyan focus:outline-none focus:ring-2 focus:ring-panel-cyan/40"
              [(ngModel)]="role"
            >
              <option *ngFor="let option of p.roleOptions" [value]="option.value">{{ option.label }}</option>
            </select>
          </label>

          <p *ngIf="errorVisible()" class="text-sm text-red-600">{{ p.errorLabel }}</p>

          <div class="flex justify-end">
            <app-button [label]="p.createButtonLabel" variant="access" (pressed)="onCreate()"></app-button>
          </div>
        </div>
      </div>
    </app-access-window>
  </div>
</div>
