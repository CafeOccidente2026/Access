<div class="flex h-screen flex-col bg-white p-3">
  <app-access-window title="REPORTE ANUNCIO" bodyClass="bg-white flex-1 flex flex-col">
    <div class="flex flex-1 flex-col gap-3 p-4">
      <div class="flex items-end gap-3">
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium text-blue-900">Fecha</span>
          <input
            type="date"
            class="rounded border border-slate-300 px-2 py-1"
            [min]="minDate"
            [max]="maxDate"
            [value]="date()"
            (input)="date.set($any($event.target).value)"
          />
        </label>
        <button
          type="button"
          class="rounded border border-slate-400 bg-slate-100 px-4 py-1.5 text-sm font-medium hover:bg-slate-200"
          (click)="generate()"
        >
          Generar reporte
        </button>
        <p *ngIf="message() as m" class="pb-1.5 text-sm text-red-600">{{ m }}</p>
      </div>

      <div *ngIf="detailUrl() || summaryUrl()" class="grid flex-1 grid-cols-2 gap-3">
        <iframe *ngIf="detailUrl() as url" title="ANUNCIO" class="h-full min-h-[480px] w-full border" [src]="url"></iframe>
        <iframe *ngIf="summaryUrl() as url" title="RESUMEN ANUNCIO" class="h-full min-h-[480px] w-full border" [src]="url"></iframe>
      </div>
    </div>
  </app-access-window>
</div>
