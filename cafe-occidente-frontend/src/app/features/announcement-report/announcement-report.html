<div class="flex h-screen flex-col bg-white p-3" *ngIf="content() as c">
  <app-access-window [title]="c.windowTitle" bodyClass="bg-white flex-1 flex flex-col">
    <div class="flex flex-1 flex-col gap-3 p-4">
      <div class="flex items-end gap-3">
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium text-blue-900">{{ c.dateLabel }}</span>
          <input
            type="date"
            data-testid="date"
            class="rounded border border-slate-300 px-2 py-1"
            [min]="minDate"
            [max]="maxDate"
            [value]="date()"
            (input)="date.set($any($event.target).value)"
          />
        </label>
        <button
          type="button"
          data-testid="generate"
          class="rounded border border-slate-400 bg-slate-100 px-4 py-1.5 text-sm font-medium hover:bg-slate-200"
          (click)="generate()"
        >
          {{ c.generateLabel }}
        </button>
        <button
          *ngIf="pdfUrl()"
          type="button"
          data-testid="print"
          class="rounded border border-slate-400 bg-slate-100 px-4 py-1.5 text-sm font-medium hover:bg-slate-200"
          (click)="print()"
        >
          {{ c.printLabel }}
        </button>
        <p *ngIf="message() as m" class="pb-1.5 text-sm text-red-600">{{ m }}</p>
      </div>

      <iframe
        *ngIf="pdfUrl() as url"
        #frame
        [title]="c.pdfTitle"
        class="min-h-[480px] w-full flex-1 border"
        [src]="url"
      ></iframe>
    </div>
  </app-access-window>
</div>
