<div class="h-screen bg-panel-sky p-3" *ngIf="data() as d">
  <app-access-window [title]="d.windowTitle" bodyClass="bg-panel-sky">
    <div class="grid grid-cols-[200px_1fr] gap-8 p-8">
      <app-menu-button-grid [options]="d.sideOptions" [columns]="1"></app-menu-button-grid>
      <app-menu-button-grid [options]="d.options" [columns]="1"></app-menu-button-grid>
    </div>
  </app-access-window>
</div>
